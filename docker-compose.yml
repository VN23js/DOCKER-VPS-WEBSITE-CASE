services:
  server:
    build: ./Server
    container_name: my-backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    build: ./my-react-app
    container_name: my-nginx
    restart: unless-stopped
    group_add:
      - "33"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /usr/share/zabbix/ui:/usr/share/zabbix/ui:ro
      - /var/run/php/zabbix.sock:/var/run/php/zabbix.sock
    networks:
      - app-network
    depends_on:
      - server

networks:
  app-network:
    driver: bridge